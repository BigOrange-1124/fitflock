server:
  port: 8888
  servlet:
    context-path: /orange


spring:
  datasource:
    url: jdbc:mysql://*/orange?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: *
    password: *
    driver-class-name: com.mysql.cj.jdbc.Driver
    druid:
#      public-key: MFwwDQYJKoZIhvcNAQEBBQADSwAwSAJBANgZQJv9eUg5sdKCgvjW7TWIwYFFOG7+MWeI71B0YH2uLtdGtl4eJffKuaDR2tJpC8O7g2ZBXtwIczjBqsPnHncCAwEAAQ==
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-on-borrow: false
      test-on-return: false
      test-while-idle: true
      pool-prepared-statements: true
      filters: stat,wall,config
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000;
      stat-view-servlet:
        enabled: true
        url-pattern: /druid/*
        login-username: admin
        login-password: admin
  data:
    redis:
      host: *
      port: *
      password: *
      jedis:
        pool:
          max-idle: 6
          max-active: 32
          max-wait: 100
          min-idle: 4
      database: 0
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      FAIL_ON_EMPTY_BEANS: false

vx:
  url:
    getOpenId: *
  appId: *
  appSecret: *
  default:
    nickName: 🙂💪
    avatarUrl: https://guohaolong.top/images/avatar/pengyuyan.jpg